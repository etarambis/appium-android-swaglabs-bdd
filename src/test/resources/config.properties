# Configuracion del framework.
# Cada clave se puede sobrescribir (en este orden de prioridad):
#   1. Propiedad de sistema:     -Dappium.url=http://otro-host:4723/
#   2. Variable de entorno:      APPIUM_URL   (clave en mayusculas y '.' -> '_')
#   3. Este archivo

# --- Appium ---
appium.url=http://127.0.0.1:4723/
app.path=src/test/resources/apk/sauceLabs.apk
app.wait.activity=com.swaglabsmobileapp.MainActivity

# --- Timeouts ---
# Espera por defecto de las paginas, en segundos
timeout.default=20
# Capabilities para emuladores lentos, en milisegundos
timeout.adb.exec=60000
timeout.uiautomator2.launch=90000

# --- Rutas ---
evidence.screenshots.dir=target/evidence/screenshots/
evidence.pagesource.dir=target/evidence/pageSource/
credentials.file=src/test/resources/data/credenciales.json

# --- Logs ---
# Debe coincidir con el valor por defecto de logDir en log4j2.xml
log.dir=target/logs
# Cantidad maxima de lineas del logcat del dispositivo que se adjuntan en un fallo
logcat.max.lines=300
